<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Layered architecture for the RestAssured automation project</title>
  <desc id="desc">A layered architecture diagram showing execution, orchestration, test, framework, service, and reporting layers.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#172033" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#355070"/>
    </marker>
    <style>
      .bg { fill: #f7f9fc; }
      .card { fill: #ffffff; stroke: #c8d3e1; stroke-width: 2; filter: url(#shadow); }
      .layer-title { font: 700 24px Arial, sans-serif; fill: #172033; }
      .layer-text { font: 400 17px Arial, sans-serif; fill: #334155; }
      .small { font: 400 14px Arial, sans-serif; fill: #526173; }
      .label { font: 700 15px Arial, sans-serif; fill: #ffffff; }
      .pill-blue { fill: #2f6690; }
      .pill-green { fill: #2d6a4f; }
      .pill-gold { fill: #9a6700; }
      .pill-purple { fill: #7b2cbf; }
      .arrow { stroke: #355070; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1100" height="720"/>
  <text x="550" y="48" text-anchor="middle" class="layer-title">RestAssured Automation Demo - Layered Architecture</text>
  <text x="550" y="76" text-anchor="middle" class="small">From local or CI execution to API validation and report generation</text>
  <rect x="90" y="115" width="920" height="82" rx="8" class="card"/>
  <rect x="115" y="135" width="128" height="34" rx="17" class="pill-blue"/>
  <text x="179" y="157" text-anchor="middle" class="label">Execution</text>
  <text x="275" y="148" class="layer-text">Engineer or Jenkins starts Maven test execution locally, in Docker, or from CI.</text>
  <text x="275" y="174" class="small">Commands: mvn clean test -DsuiteXmlFile=... | docker run ... mvn test</text>
  <path d="M550 202 L550 230" class="arrow"/>
  <rect x="90" y="235" width="920" height="82" rx="8" class="card"/>
  <rect x="115" y="255" width="150" height="34" rx="17" class="pill-green"/>
  <text x="190" y="277" text-anchor="middle" class="label">Orchestration</text>
  <text x="295" y="268" class="layer-text">Maven Surefire reads the selected TestNG XML suite and starts listed test classes.</text>
  <text x="295" y="294" class="small">Suites: testng-apitestcrud.xml and testng-authApiTestCrud.xml</text>
  <path d="M550 322 L550 350" class="arrow"/>
  <rect x="90" y="355" width="920" height="82" rx="8" class="card"/>
  <rect x="115" y="375" width="106" height="34" rx="17" class="pill-gold"/>
  <text x="168" y="397" text-anchor="middle" class="label">Tests</text>
  <text x="255" y="388" class="layer-text">TestNG classes model CRUD flows and validate HTTP status, headers, and response body fields.</text>
  <text x="255" y="414" class="small">Examples: PostObject, GetObject, UpdateObject, DeleteObject, and authenticated equivalents</text>
  <path d="M550 442 L550 470" class="arrow"/>
  <rect x="90" y="475" width="920" height="82" rx="8" class="card"/>
  <rect x="115" y="495" width="144" height="34" rx="17" class="pill-blue"/>
  <text x="187" y="517" text-anchor="middle" class="label">Framework</text>
  <text x="290" y="508" class="layer-text">BaseApiTest configures RestAssured, request/response logging, shared object id, and properties.</text>
  <text x="290" y="534" class="small">Libraries: Rest-Assured, TestNG, Hamcrest, Jackson, ExtentReports</text>
  <path d="M392 562 L315 603" class="arrow"/>
  <path d="M708 562 L785 603" class="arrow"/>
  <rect x="90" y="605" width="430" height="78" rx="8" class="card"/>
  <rect x="115" y="625" width="94" height="34" rx="17" class="pill-green"/>
  <text x="162" y="647" text-anchor="middle" class="label">Service</text>
  <text x="235" y="638" class="layer-text">REST calls execute against restful-api.dev.</text>
  <text x="235" y="664" class="small">Endpoints: /objects and /collections/products/objects</text>
  <rect x="580" y="605" width="430" height="78" rx="8" class="card"/>
  <rect x="605" y="625" width="105" height="34" rx="17" class="pill-purple"/>
  <text x="657" y="647" text-anchor="middle" class="label">Reports</text>
  <text x="735" y="638" class="layer-text">TestNG listener writes execution output.</text>
  <text x="735" y="664" class="small">target/surefire-reports and target/report/extent-report.html</text>
</svg>
